# ==========================================================
# Courier Tracking System - Database Configuration
# ==========================================================
# Primary Database: MySQL 8
db.host=localhost
db.port=3306
db.name=courier_db
db.user=root
db.password=
db.url=jdbc:mysql://localhost:3306/courier_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# Auto-Initialize tables and initial seed data if empty
db.autoInit=true

# Fallback mode: If MySQL is not running on local machine,
# application gracefully uses embedded SQLite database so demo NEVER fails.
db.fallback.enabled=true
db.fallback.url=jdbc:sqlite:courier_db.sqlite
